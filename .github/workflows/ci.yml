name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  PRAXIS_TEST_DATABASE_URL: postgresql+psycopg://praxis@127.0.0.1:5432/postgres

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      # Throwaway Postgres (trust auth, reachable only inside the runner).
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: praxis
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U praxis" --health-interval 2s --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: .venv/bin/python scripts/wait_for.py --postgres "$PRAXIS_TEST_DATABASE_URL"
      - run: .venv/bin/ruff check .
      - run: .venv/bin/ruff format --check .
      - run: .venv/bin/mypy
      - run: .venv/bin/pytest --cov
      - run: .venv/bin/python scripts/export_payload_schemas.py --check
      - run: .venv/bin/python scripts/secret_scan.py
      - run: uv export --no-hashes --no-emit-project -o /tmp/req.txt && .venv/bin/pip-audit -r /tmp/req.txt

  # Phase 3: producer + consumers over the real Pub/Sub API (emulator; no cloud, no cost).
  pubsub-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Throwaway Postgres (trust auth, reachable only inside the runner).
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: praxis
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U praxis" --health-interval 2s --health-timeout 5s
          --health-retries 30
    env:
      PUBSUB_EMULATOR_HOST: 127.0.0.1:8085
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - name: Start Pub/Sub emulator
        run: >-
          docker run -d --name pubsub -p 127.0.0.1:8085:8085
          gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
          gcloud beta emulators pubsub start --host-port=0.0.0.0:8085 --project=praxis-local
      - run: .venv/bin/python scripts/wait_for.py --http http://127.0.0.1:8085 --timeout 180
      - run: .venv/bin/python scripts/wait_for.py --postgres "$PRAXIS_TEST_DATABASE_URL"
      - run: .venv/bin/pytest tests/integration -m pubsub_emulator -v --no-cov

  # Phase 3: chaos smoke (duplicates, delay, reorder, crashes); the command exits 1 unless the
  # final control-plane state equals the independent oracle. (Replay: pytest scenario 11.)
  event-chaos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Throwaway Postgres (trust auth, reachable only inside the runner).
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: praxis
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U praxis" --health-interval 2s --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: .venv/bin/python scripts/wait_for.py --postgres "$PRAXIS_TEST_DATABASE_URL"
      - name: Create database
        run: >-
          .venv/bin/python -c "from sqlalchemy import create_engine, text;
          e = create_engine('$PRAXIS_TEST_DATABASE_URL', isolation_level='AUTOCOMMIT');
          e.connect().execute(text('CREATE DATABASE praxis_events'))"
      - run: >-
          .venv/bin/python -m praxis.streaming
          --database-url postgresql+psycopg://praxis@127.0.0.1:5432/praxis_events migrate
      - name: Chaos run (exit 1 unless the final state equals the oracle)
        env:
          PRAXIS_LOG_LEVEL: ERROR
        run: >-
          .venv/bin/python -m praxis.streaming
          --database-url postgresql+psycopg://praxis@127.0.0.1:5432/praxis_events run-local
          --customers 500 --days 28 --duplicate-rate 0.2 --crash-rate 0.01
          --report event-chaos.json > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: event-chaos-report
          path: event-chaos.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm audit --omit=dev --audit-level=high

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -recursive -check
      - run: terraform -chdir=envs/dev init -backend=false -input=false
      - run: terraform -chdir=envs/dev validate
