repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: .venv/bin/ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: .venv/bin/ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: .venv/bin/mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: architecture
        name: import contracts (make arch)
        entry: make arch
        language: system
        types: [python]
        pass_filenames: false
      - id: secret-scan
        name: secret scan
        entry: .venv/bin/python scripts/secret_scan.py
        language: system
        pass_filenames: false
