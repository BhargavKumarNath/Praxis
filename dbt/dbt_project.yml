name: praxis
version: "0.1.0"
config-version: 2
profile: praxis

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]

flags:
  send_anonymous_usage_stats: false

vars:
  # Empty locally. Set PRAXIS_BQ_SCHEMA_PREFIX=praxis_dev_ ONLY for BigQuery runs (Terraform names).
  schema_prefix: "{{ env_var('PRAXIS_BQ_SCHEMA_PREFIX', '') }}"
  # Partition-filter window for fact reads. BigQuery facts set require_partition_filter, so
  # every model that reads a fact must bound its partition column with these.
  start_date: "2026-01-01"
  end_date: "2026-12-31"
  # FRED values are published weeks after the period they describe. A macro value is only
  # usable as a feature from observed_date + this many days (prevents look-ahead leakage).
  macro_release_lag_days: 45

models:
  praxis:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts
    features:
      +materialized: view
      +schema: marts
