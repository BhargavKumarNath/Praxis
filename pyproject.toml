[project]
name = "praxis"
version = "0.0.1"
description = "Praxis: Autonomous Revenue Decision Infrastructure"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "numpy>=2.5.3",
    "duckdb>=1.5.6",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "google-cloud-pubsub>=2.25",
    "lightgbm>=4.7.0",
    "pymc>=6.3.2",
    "scipy>=1.18.1",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "hypothesis>=6.110",
    "jsonschema>=4.23",
    "ruff>=0.6",
    "mypy>=1.11",
    "pip-audit>=2.7",
    "pre-commit>=3.8",
    "types-jsonschema>=4.26.0.20260518",
    "dbt-core>=1.12.5",
    "dbt-duckdb>=1.11.0",
    "dbt-bigquery>=1.12.1",
    "import-linter>=2.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/praxis"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM", "RUF", "DTZ", "T20", "C90", "PLR0911", "PLR0912", "PLR0913", "PLR0915"]

# Complexity budget (CLAUDE.md "CI/CD and code health"). Existing offenders carry a
# `complexity-debt` noqa; tests/unit/test_repo_hygiene.py caps their number (ratchet).
[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-branches = 12
max-statements = 50
max-args = 7
max-returns = 6

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR0913"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "scripts"]

# PyMC / ArviZ / SciPy ship no complete type information.
[[tool.mypy.overrides]]
module = ["pymc", "pymc.*", "arviz", "arviz.*", "pytensor", "pytensor.*", "scipy", "scipy.*"]
ignore_missing_imports = true

# google-cloud-pubsub ships no complete type information for these namespaces.
[[tool.mypy.overrides]]
module = ["google.cloud.pubsub_v1", "google.cloud.pubsub_v1.*", "google.protobuf", "google.protobuf.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
markers = [
    "integration: touches a real boundary (DuckDB + dbt, Postgres, Pub/Sub emulator); runs in make test / CI backend",
    "slow: long-running scale smoke test",
    "bigquery_live: hits a real BigQuery sandbox project; only via `make bq-verify`",
    "pubsub_emulator: needs the Pub/Sub emulator (PUBSUB_EMULATOR_HOST); make test / CI backend start it",
    "stripe_live: hits the real Stripe Sandbox (test key + Stripe CLI in Docker); only via `make stripe-verify`",
]

[tool.coverage.run]
branch = true
source = ["praxis"]

[tool.coverage.report]
fail_under = 85
show_missing = true

# --- Architecture contracts (import-linter; `make arch`). A new package MUST be placed in a
# layer below; changing a contract needs an ADR. See CLAUDE.md "CI/CD and code health".
[tool.importlinter]
root_package = "praxis"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layered architecture (higher may import lower, never the reverse)"
type = "layers"
layers = [
    "praxis.api | praxis.science",
    "praxis.pricing | praxis.payments",
    "praxis.streaming | praxis.forecasting | praxis.elasticity",
    "praxis.control | praxis.data | praxis.simulator",
    "praxis.events",
    "praxis.domain",
    "praxis.config : praxis.logging : praxis.tracing : praxis.provenance : praxis.errors : praxis.observability",
]

[[tool.importlinter.contracts]]
name = "Models never import the simulator (ground truth stays out of reach)"
type = "forbidden"
source_modules = ["praxis.forecasting", "praxis.elasticity", "praxis.pricing"]
# praxis.science is the only place that joins model output with ground truth (ADR 0012).
forbidden_modules = ["praxis.simulator", "praxis.science"]
# Evaluation CLI reads only the scenario *config* to label spike days for slicing.
ignore_imports = ["praxis.forecasting.__main__ -> praxis.simulator.config"]

[[tool.importlinter.contracts]]
name = "Domain and event contracts stay pure (no I/O frameworks)"
type = "forbidden"
source_modules = ["praxis.domain", "praxis.events"]
forbidden_modules = ["sqlalchemy", "duckdb", "fastapi", "httpx", "google", "lightgbm", "alembic", "psycopg", "pymc", "arviz"]

[[tool.importlinter.contracts]]
name = "Only the API layer uses the web framework"
type = "forbidden"
source_modules = [
    "praxis.control", "praxis.data", "praxis.domain", "praxis.events", "praxis.forecasting",
    "praxis.simulator", "praxis.streaming", "praxis.elasticity", "praxis.science",
    "praxis.pricing", "praxis.payments",
]
forbidden_modules = ["fastapi", "starlette", "uvicorn"]

# Payments sees no simulator ground truth and no pricing internals: Stripe and the synthetic
# provider only exchange provider-neutral snapshots and internal event contracts (ADR 0014).
[[tool.importlinter.contracts]]
name = "Payments are independent of the simulator, science and pricing"
type = "forbidden"
source_modules = ["praxis.payments"]
forbidden_modules = ["praxis.simulator", "praxis.science", "praxis.pricing", "praxis.forecasting", "praxis.elasticity"]

# --- Per-module coverage floors (`make coverage-gate`, scripts/coverage_gate.py). Ordered:
# the FIRST matching glob wins. Critical = money, state machines, idempotency, event contracts,
# model lineage and serving (required_test.md s5: >= 95%). Add every new critical module here
# (optimiser, guardrails, webhooks, agent permissions) in the phase that creates it.
[tool.praxis.coverage_floors]
"src/praxis/simulator/__main__.py" = 0  # 3-line shim; runner.main is tested
"src/praxis/domain/*" = 95
"src/praxis/control/*" = 95
"src/praxis/events/*" = 95
"src/praxis/streaming/runtime.py" = 95
"src/praxis/streaming/redrive.py" = 95
"src/praxis/streaming/memory.py" = 95
"src/praxis/streaming/consumers/*" = 95
"src/praxis/forecasting/artifact.py" = 95
"src/praxis/forecasting/service.py" = 95
"src/praxis/forecasting/features.py" = 95
"src/praxis/elasticity/validity.py" = 95   # experiment validity gates (SRM, assignment, exposure)
"src/praxis/elasticity/dataset.py" = 95    # eligibility, assignment audit, outcome definition
"src/praxis/elasticity/estimators.py" = 95
"src/praxis/elasticity/artifact.py" = 95
"src/praxis/science/*" = 95                # ground-truth acceptance decides the phase gate
"src/praxis/pricing/*" = 95                # optimiser, constraints, guardrails, audit store (s5)
"src/praxis/payments/*" = 95               # webhooks, idempotent payment writes, inbox (s5)
"src/praxis/api/*" = 95
"src/praxis/*" = 85
