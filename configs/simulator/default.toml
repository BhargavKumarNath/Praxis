[infrastructure]
diurnal_amplitude = 0.35
diurnal_peak_local_hour = 14.0
hourly_noise_sigma = 0.03
latency_load_coeff = 2.0
latency_overload_coeff = 5.0
p95_base_ratio = 1.8
p95_load_coeff = 2.0
error_knee = 0.85
error_slope = 0.15
cost_scarcity_coeff = 0.25

[pricing]
# price_changes / interventions / infrastructure shocks are empty in the default world;
# scenario configs (tests, Phase 5) add them.

[billing]
period_days = 30
max_attempts = 3
retry_offsets_days = [3, 7]
retry_success_base = 0.35
retry_success_slope = 0.50

[billing.failure_reason_weights]
insufficient_funds = 0.40
card_declined = 0.30
expired_card = 0.15
processor_error = 0.10
authentication_required = 0.05

[behaviour]
