churn_latency_beta = 0.8
churn_error_beta = 30.0
churn_failure_beta = 0.3
burden_decay = 0.95
churn_hazard_cap = 0.5
demand_service_beta = 0.3
conversion_price_beta = 0.5
conversion_clip = [0.02, 0.98]
tier_change_daily = 0.004
