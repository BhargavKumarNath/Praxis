# MLOps steady world (Phase 10 attempt 2). SYNTHETIC. Overlay on configs/simulator/default.toml.
#
# PRE-REGISTERED 2026-10-18 (ADR 0017 amendment), from a development-seed (seed 1) diagnosis,
# before any drill ran on it and before any held-out world was built from it.
# tests/mlops/test_config.py pins this hash. Do not edit to flatter a detector (CLAUDE.md s9).
#
# Purpose: the NULL CONTROL of the lifecycle drill, a world in which nothing changes after the
# forecaster's training window, so that every decision alarm on it is a false alarm.
#
# = the pricing shadow world (configs/simulator/scenarios/pricing_shadow.toml; every event
# copied verbatim, a test checks the copy) with ONE change: per-customer daily demand growth
# is switched off (default: growth ~ N(0.002, 0.004) per day, clipped to [-1%, +1.5%],
# COMPOUNDING). Attempt 1 used the pricing shadow world itself as the steady world; on dev
# seed 1 its compounding, heterogeneous growth concentrates each region's demand in a few
# fast-growing customers (eu_west top-3 share 0.18 -> 0.28 over days 112..251) and a frozen
# champion's error rises to 1.41x its backtest (eu_west 2.43x), with the seasonal naive's
# error up 1.38x too: real organic change, not a null. With growth switched off (this file,
# dev seed 1) the same frozen champion stays at 0.81-0.96x overall and <= 1.20x on every
# slice for days 196..252. Continuing arrivals after day 196 was ALSO tested and changed
# nothing (the population shrinks before day 196 as well), so arrivals are left as they are.
# Organic concentration is documented as a monitoring limitation (docs/mlops.md), not hidden.

[run]
days = 252  # 196 days of the forecast world + 8 weekly shadow cycles

[population]
arrival_horizon_days = 196
# The only difference from the pricing shadow world: no organic per-customer growth.
growth_mean = 0.0
growth_sd = 0.0001  # the config requires sd > 0; 0.0001/day = at most ~2.5% drift in 252 days

[[infrastructure.demand_spikes]]
region = "eu_west"
start_day = 40
end_day = 46
multiplier = 1.6

