# MLOps drift world (Phase 10). SYNTHETIC. Overlay on configs/simulator/default.toml.
#
# PRE-REGISTERED 2026-10-11, before any world was built from it or any monitor run on it.
# Do not edit to flatter a detector (CLAUDE.md s9); tests/mlops/test_config.py pins this hash.
#
# = the pricing shadow world (configs/simulator/scenarios/pricing_shadow.toml, copied verbatim
# below up to the "Phase 10 drift" marker; a test checks the copy) + two UNANNOUNCED,
# PERSISTENT demand changes after the demand forecaster's training window (days 0..195):
#
# * eu_west, every product: compounding growth of ~15% a week from day 203 (a ramp a
#   lag-based model chronically under-forecasts);
# * us_east, api_requests: an abrupt, permanent collapse to 50% from day 210.
#
# Days 0..202 are identical to the pricing shadow world of the same seed (arrays replace on
# overlay, so the earlier events are repeated; the simulator draws per (seed, stream, day)).

[run]
days = 252  # 196 days of the forecast world + 8 weekly shadow cycles

[population]
arrival_horizon_days = 196

[[infrastructure.demand_spikes]]
region = "eu_west"
start_day = 40
end_day = 46
multiplier = 1.6

[[infrastructure.demand_spikes]]
